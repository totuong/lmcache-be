server.port=8081
spring.application.name=vLLM
app.model.url=${LLM_MODEL_URL:http://localhost:8000}
app.model.name=${LLM_MODEL_NAME:Qwen/Qwen2.5-1.5B-Instruct}

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lmcache
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# LMCache Engine & L2 Cache Configuration
lmcache.config-file-path=${LMCACHE_CONFIG_FILE:lmcache_vllm.yaml}
lmcache.vllm-container-name=${VLLM_CONTAINER_NAME:vllm-engine}
lmcache.auto-restart-vllm=${VLLM_AUTO_RESTART:false}
# Lệnh restart tiến trình vLLM trên Ubuntu (Systemd service hoặc script bash)
# Ví dụ: sudo systemctl restart vllm HOẶC /home/username/restart_vllm.sh
lmcache.restart-command=${LMCACHE_RESTART_COMMAND:}
lmcache.default-chunk-size=256
lmcache.default-max-local-cpu-size-gb=5.0
lmcache.default-remote-serde=naive
